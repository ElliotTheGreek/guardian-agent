name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write     # for the GitHub Release
  id-token: write     # for PyPI OIDC Trusted Publishing

jobs:
  publish:
    name: Build + publish guardian-agent to PyPI
    runs-on: ubuntu-latest
    environment: pypi-publish   # must match the env name on https://pypi.org/manage/account/publishing/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] --no-build-isolation
          python -m pip install build twine

      - name: Confirm tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF##*/v}"
          PYPROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Tag matches pyproject.toml version: $PYPROJECT_VERSION"

      - name: Ruff (lint)
        run: python -m ruff check src/ tests/

      - name: Ruff (format check)
        run: python -m ruff format --check src/ tests/

      - name: Pytest
        run: python -m pytest -v

      - name: Mypy (strict on src/)
        run: python -m mypy src/

      - name: Verify build (sdist + wheel + forbidden-pattern gate)
        run: python scripts/verify-build.py

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF##*/}" \
            --title "guardian-agent ${GITHUB_REF##*/}" \
            --notes "Published to PyPI: https://pypi.org/project/guardian-agent/${GITHUB_REF##*/v}/" \
            --generate-notes \
            dist/*
