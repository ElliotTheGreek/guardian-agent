[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardian-agent"
version = "0.2.0"
description = "A runtime supervisor for tool-using LLM agents: audit log + ed25519 signatures, tool-permission policy, HITL approval gates, emergency-stop, honeytokens, capability tripwires, per-class rate limits, two-key operator gate, dead-man's heartbeat, external chain attestation, and offline analysis CLIs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Elliot Mousseau", email = "elliot@flowdot.ai" },
]
keywords = [
    "ai-safety",
    "agents",
    "llm",
    "audit-log",
    "supervisor",
    "guardian-agents",
    "human-in-the-loop",
    "capability-security",
    "mcp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "python-ulid>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
guardian-verify = "guardian_agent.cli.guardian_verify:main"
guardian-baseline = "guardian_agent.cli.guardian_baseline:main"
guardian-correlator = "guardian_agent.cli.guardian_correlator:main"

[project.urls]
Homepage = "https://github.com/flowdot-llc/guardian-agent"
Repository = "https://github.com/flowdot-llc/guardian-agent"
Documentation = "https://github.com/flowdot-llc/guardian-agent/blob/main/SPEC.md"
Issues = "https://github.com/flowdot-llc/guardian-agent/issues"
Changelog = "https://github.com/flowdot-llc/guardian-agent/blob/main/CHANGELOG.md"
Upstream = "https://flowdot.ai"

[tool.hatch.build]
exclude = [
    "tests/",
    "tests/**",
    "**/__pycache__/",
    "**/*.pyc",
    "**/*.pyo",
    ".pytest_cache/",
    ".ruff_cache/",
    ".mypy_cache/",
    ".github/",
    "scripts/",
    "examples/",
    ".gitignore",
    ".env*",
    "*.log",
    ".DS_Store",
    "Thumbs.db",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardian_agent"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist — hatchling's default sdist includes everything VCS-tracked
# minus its built-in exclusions, which leaks .gitignore and similar dev metadata.
# Being explicit about what ships keeps the published tarball minimal.
include = [
    "src/guardian_agent/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SPEC.md",
    "ROADMAP.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
